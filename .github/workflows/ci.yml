name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-shell:
    name: Shell Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shfmt
        run: |
          SHFMT_VERSION="v3.10.0"
          curl -sS "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64" -L -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt

      - name: Check shell formatting (shfmt)
        run: |
          find . -name '*.sh' -not -path './node_modules/*' | xargs shfmt -i 2 -bn -sr -d

      - name: Lint shell scripts (ShellCheck)
        run: |
          find . -name '*.sh' -not -path './node_modules/*' | xargs shellcheck --shell=bash

  lint-markdown:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint Markdown (markdownlint-cli2)
        run: npx markdownlint-cli2 '**/*.md'

      - name: Check Markdown formatting (Prettier)
        run: npx prettier --check '**/*.md'

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run bats test suite
        run: npx bats tests/

  # macOS ships bash 3.2, so anything using bash 4+ syntax (declare -A, local -n,
  # ${var,,}) breaks for a large share of users while passing on ubuntu's bash 5.
  compat-bash32:
    name: Bash 3.2 Compatibility
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm the runner really has bash 3.2
        run: /bin/bash --version | head -1

      - name: Run test suite under stock macOS bash
        run: /bin/bash -c 'npx bats tests/'

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check skill and hook script references resolve
        run: bash scripts/check-skill-references.sh

      # Guards are write-time and cannot see git merges or out-of-session edits.
      # This reconciles declared pipeline state against the repository as a whole.
      - name: Audit pipeline consistency
        run: bash scripts/pipeline-audit.sh

      - name: Check principled-docs template drift
        run: bash plugins/principled-docs/skills/scaffold/scripts/check-template-drift.sh

      - name: Check cross-plugin script drift
        run: bash scripts/check-cross-plugin-drift.sh

      - name: Validate root structure
        run: bash plugins/principled-docs/lib/validate-structure.sh --root

      - name: Validate marketplace manifest
        run: |
          # Verify marketplace.json exists and is valid JSON
          if command -v jq &> /dev/null; then
            jq . .claude-plugin/marketplace.json > /dev/null
          else
            python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"
          fi
          # Verify every listed plugin source directory exists
          for src in $(python3 -c "
          import json
          with open('.claude-plugin/marketplace.json') as f:
              data = json.load(f)
          for p in data.get('plugins', []):
              print(p['source'])
          "); do
            if [ ! -d "$src" ]; then
              echo "ERROR: Plugin source directory not found: $src"
              exit 1
            fi
            echo "OK: $src exists"
          done

      - name: Validate plugin manifests
        run: |
          for plugin_dir in plugins/*/; do
            [ -d "$plugin_dir" ] || continue
            echo "Validating $plugin_dir..."
            if [ ! -f "${plugin_dir}.claude-plugin/plugin.json" ]; then
              echo "ERROR: Missing .claude-plugin/plugin.json in $plugin_dir"
              exit 1
            fi
            # Verify plugin.json is valid JSON
            if command -v jq &> /dev/null; then
              jq . "${plugin_dir}.claude-plugin/plugin.json" > /dev/null
            else
              python3 -c "import json; json.load(open('${plugin_dir}.claude-plugin/plugin.json'))"
            fi
            echo "OK: $plugin_dir has valid plugin.json"
          done
          for plugin_dir in external_plugins/*/; do
            [ -d "$plugin_dir" ] || continue
            echo "Validating $plugin_dir..."
            if [ ! -f "${plugin_dir}.claude-plugin/plugin.json" ]; then
              echo "ERROR: Missing .claude-plugin/plugin.json in $plugin_dir"
              exit 1
            fi
            if command -v jq &> /dev/null; then
              jq . "${plugin_dir}.claude-plugin/plugin.json" > /dev/null
            else
              python3 -c "import json; json.load(open('${plugin_dir}.claude-plugin/plugin.json'))"
            fi
            echo "OK: $plugin_dir has valid plugin.json"
          done
      # Hook behaviour is covered by tests/hooks.bats in the `test` job: 34 tests
      # across all 11 hooks, including the no-jq fallback path and malformed input,
      # plus corpus-wide checks that every accepted ADR and terminal proposal is
      # blocked. The inline smoke tests that used to live here duplicated that with
      # weaker assertions and a second place to update per hook change.
